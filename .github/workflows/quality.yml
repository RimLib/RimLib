name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Electron system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Quality with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run quality
      - name: Quality
        if: runner.os != 'Linux'
        run: npm run quality
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
